 return `<section class="panel attention-panel ${issues.length===3?'three-issues':''}" aria-labelledby="attentionTitle"><div class="panel-head"><div><div class="eyebrow">03 / 看证据，下动作</div><h2 id="attentionTitle">${s.mode==='today'?'今日优先关注':'本阶段优先关注'}</h2></div>${tag(state.playing?'随回放更新':'当前截点')}</div><div class="attention-cards">${issues.length?issues.map((issue,i)=>`<article class="attention-card ${issue.kind}" data-issue-key="${issue.key}"><div class="issue-top"><b>0${i+1} ${issue.group}</b><span class="${tone(issue.g.delta)}">${signedWan(issue.g.delta)} 万</span></div><h3>${issue.title}</h3><p class="driver-evidence">${issue.driver?`${issue.driver.key} ${signedWan(issue.driver.delta)}万`:'当前无成交结构差额'}</p><p class="people-evidence">${issue.leaders.length?issue.leaders.map(p=>`${shortID(p.id)} ${signedWan(p.delta)}万`).join('；'):'暂未出现非零人员贡献'}</p><p class="flow-evidence">${issue.flow.triggered?'相关流程变化：':'流程待核线索：'}${issue.flow.focus.name}，等待${issue.flow.focus.W}人</p><div class="issue-reason">${issue.purpose==='flow'?`完成比例下降${fmt(-issue.flow.focus.change*100,1)}个百分点，等待增加${issue.flow.focus.waitingDelta}人`:issue.lag.start?`本轮${s.mode==='today'?'偏离':'负差'}自${issue.lag.start}${issue.lag.active?'，已持续':'，待持续观察'}`:issue.g.delta>0?'按正向增量选出，核查持续性':'未满足持续偏离条件，保留负差观察'}</div><div class="issue-actions">${button('reason','查看原因',`data-group="${issue.group}" data-purpose="${issue.purpose}"`)}${button('dispatch','下发动作',`data-group="${issue.group}" data-purpose="${issue.purpose}"`,'primary')}</div></article>`).join(''):`<div class="empty-state"><strong>当前尚无金额变化</strong><p>推进历史时间后再判断组织贡献。无证据时不生成负差对象。</p></div>`}</div><div class="attention-footer"><strong>动作接收人：对应小组长</strong><p>先核证据，由组长拆解。漏斗归属与业绩归属不同，不直接判定个人责任。</p>${button('records',`查看动作留痕 <span class="record-count">${actionRecords.length}</span>`,'','wide')}</div></section>`;
}

 document.getElementById('detailBody').innerHTML=`<div class="detail-context">${tag(dayLabel(s.date)+' '+(s.mode==='today'?clockLabel(s.minute):'日终'))}<span>${s.mode==='today'?s.baselineLabel:'7月累计 vs 6月同期'} · 回放已暂停</span></div><div class="detail-title"><div><div class="eyebrow">${sale?'个人证据':'小组证据链'}</div><h2>${sale?`销售 ${sale}`:group}</h2><p>${sale?`${group} · 正常归属成交${wan(p?.amount||0)}万元，变化${signedWan(p?.delta||0)}万元。`:issue.title}</p></div><div>${sale?button('group-detail','← 返回小组证据'):''}${button('dispatch','下发给小组长',`data-group="${group}" data-purpose="${issue.purpose}"`,'primary')}</div></div><div class="evidence-chain">${detailFacts.map((t,i)=>`<div><span>0${i+1}</span><p>${esc(t)}</p></div>`).join('')}</div><p class="boundary-note">${sale&&p?`该销售${s.mode==='today'?'观察日':'本月截至观察日'}在岗资格记录${p.onDays}天，另有受限成交${p.restrictedCount}笔、${wan(p.restricted)}万元。`:''}全行月目标缺口${wan(Math.max(0,s.monthGap))}万元与本组同期变化${signedWan(issue.g.delta)}万元是两类问题，不等同目标责任。</p>${!sale?`<div class="section-heading"><div><h3>人员贡献直接定位</h3><p>负向合计${wan(-negative)}万，正向合计${wan(positive)}万，抵消后${signedWan(issue.g.delta)}万。</p></div></div><div class="table-wrap people-table"><table><thead><tr><th>销售教学ID</th><th>历史比较 / 万</th><th>当前 / 万</th><th>贡献差 / 万</th><th>状态与证据</th></tr></thead><tbody>${issue.people.map(row=>`<tr class="${issue.leaders.some(l=>l.id===row.id)?'highlight-row':''}"><td>${button('person',esc(row.id),`data-sale="${row.id}"`)}</td><td>${wan(row.baseline)}</td><td>${wan(row.amount)}</td><td class="${tone(row.delta)}">${signedWan(row.delta)}</td><td>${row.amount===0&&row.baseline>0?'无正常成交，先核归属':row.delta>0?'金额增长':row.delta<0?'金额减少':'无金额变化'}${row.restrictedCount?`<small>另有受限${row.restrictedCount}笔</small>`:''}</td></tr>`).join('')||'<tr><td colspan="5">该时点没有可比较人员记录。</td></tr>'}</tbody></table></div>`:''}<div class="detail-grid"><section>${structureTable(s,group,sale)}</section><section><div class="section-heading"><h3>${s.mode==='today'?'变化从哪个时刻出现':'变化从哪一天出现'}</h3></div>${lineChart(s,group,sale,'detail')}<p class="fine-print">${sale?'个人曲线使用该销售正常归属集合，不据此推断跟进动作。':issue.lag.start?`小组当前这一轮${s.mode==='today'?'偏离':'累计同期负差'}起于${issue.lag.start}。`:'当前未形成持续偏离。'}图中范围与人员及结构证据一致。</p></section></div>${funnelTable(s,group,sale)}<section class="detail-action"><h3>建议核查事项</h3><p>${esc(detailQuestion)}</p><p class="fine-print">由小组长核实当前承接后拆解；现有资料没有真实组长姓名或销售动作记录。</p>${button('dispatch','编辑并下发动作',`data-group="${group}" data-purpose="${issue.purpose}"`,'primary')}</section>`;
}

 const s=currentSnapshot(),term=structureRows(s,null,null,'term').find(r=>r.key==='12期');
 document.getElementById('detailBody').innerHTML=`<div class="detail-context">${tag(dayLabel(s.date)+' '+(s.mode==='today'?clockLabel(s.minute):'日终'))}<span>南京分行 · 全部有效成交 · 回放已暂停</span></div><div class="detail-title"><div><div class="eyebrow">全行分析</div><h2>增长结构与相关流程</h2><p>当前${wan(s.amount)}万元，较${s.baselineLabel}${signedWan(s.delta)}万元。</p></div></div><p class="evidence-callout">${term?`12期成交${wan(term.amount)}万元，金额占比${pct(ratio(term.amount,s.amount))}；较比较期${signedWan(term.delta)}万元${s.delta>0?'，占全行净增'+pct(term.delta/s.delta):''}。`:''}期数不是独立产品，金额占比与笔数占比应分别观察。</p><div class="detail-grid"><section>${structureTable(s,null)}</section><section><div class="section-heading"><h3>全行时间证据</h3></div>${lineChart(s,null,null,'detail')}</section></div>${funnelTable(s,null)}<section class="detail-action"><h3>从全行落到小组核查</h3><p>全行目标缺口${wan(Math.max(0,s.monthGap))}万元，另行观察小组同期变化；不把局部下降分摊为目标责任。</p><div class="issue-actions">${GROUPS.map(g=>button('reason','查看'+g,`data-group="${g}"`)).join('')}</div></section>`;

function renderMethod(){
 document.getElementById('methodBody').innerHTML=`<h2>数据与判断规则</h2><h3>哪些是真实数据</h3><p>主工作簿《${DATA.meta.sourceFile}》，标的${DATA.meta.orderRows}行、用户${DATA.meta.userRows}人、组织日表${DATA.meta.organizationRows}行。6月与7月完整，5月为部分期。成交时间保留源值，按15分钟截点真实累计，不生成模拟成交。</p><p>原始成交覆盖全天，故回放使用00:00–24:00。24:00代表该日23:59:59。每个视图仅使用观察截点及之前事件；历史资料重建不等于当时实际到数快照。默认日选择7月成交记录最多的一日，便于观察，不称最新数据。</p><h3>日参考与近7日基准</h3><p>正式目标只有分行月目标，7月744万元。今日节奏参考＝max(0，744万−当日开始前7月累计)÷含当日剩余覆盖日期数，每日开始时固定。不是总部日目标，也不分摊到小组。没有经营日开关；6/7月61天每天有成交，包含16个周末日，Demo把完整覆盖的日期视为可经营日，生产需确认经营日历。</p><p>近7日线采用观察日前7个完整覆盖日期在相同钟点的累计成交均值，含周末和零成交时点，不挑出有成交的时段。当前基准日期可在图下核对。组别与个人基准使用同一组历史日期和正常归属口径，人员覆盖可能变化，不能当公平能力考核。</p><h3>关注规则是透明Demo规则</h3><p>小组持续偏慢：同刻基准≥0.20万元、负差≥0.10万元、相对落后≥20%，且连续4个15分钟节点满足（跨度45分钟）。优先按持续偏离、负差金额排序；不满足持续条件的负差明确写“观察”。正向项按增量挑选，核查持续性。无差额不生成问题。金额贡献分别列正向/负向项占比，受限另列对账。</p><p>相关流程下降关注：同一环节两个截点D均≥30人、C/D下降至少2个百分点、等待增加至少5人。日内比较前一日同刻，月度比较6月同期截至日。未触发时只描述等待变化，不用最低比例判定问题。阈值为原型筛选条件，非正式业务考核线；两期用户构成与观察时长不同，不作因果推断。</p><h3>月度故事与目标压力</h3><p>压力倍数＝剩余达标所需日均÷截至当日近7日实际日均。倍数≤1标注近期节奏覆盖；与7日前相比下降/上升至少20%，分别标注改善/压力扩大；其余承压，月初不足7日单列。月末只展示实际结果。没有日终或月末预测。</p><p>故事节点由历史压力序列选取：第一个完整7日观察点、最低压力前的高点、最低压力点、其后首次回升至最低点1.5倍的日期、月末。当前为${STORY_DAYS.map(d=>d+'日').join('、')}。节点选择属于月末回顾编排，各节点中的金额和证据仍按当时截断。可手动查看任一天。</p><h3>业绩、漏斗和管理边界</h3><p>有效GMV按唯一成交标的金额累计。订单按发标销售ID＋申请日历史组织检查，正常排名排除受限但总体保留。注册队列按首次绑定销售与注册日组织。两者责任关系不同，没有当前承接记录，禁止把个人漏斗变化写成其GMV下降原因。期数不是产品，新老客与首次/后续定义分开。</p><p>主漏斗全量保留新/慢用户，N=A+D、D=C+W，逆序只隔离所在区间。超过30天仅为等待分层。画像只有月底现态，不用于历史解释。正式小组/个人目标、组长姓名、真实动作反馈、利润及风险事实缺失，不造数。</p><h3>模拟下发与留痕</h3><p>动作发给对应小组长角色，保存观察时点、证据、管理要求及本机操作时间。确认下发只生成本机模拟记录，无消息接口。优先保存在本浏览器；存储不可用时保留本次会话并提示导出。模拟状态为“已下发 / 待反馈”，不生成假反馈或真实回执。</p><p class="fine-print">规则来源：《01_任务与口径》、execution_profile、《05_EA4业务口径确认记录》；分析思路参考《02_领导报告_4.1审阅后版》。主工作簿SHA-256：${DATA.meta.sourceHash}</p>`;
}

const STORAGE_KEY='nanjing-cockpit-v02-actions';
let storageAvailable=true,actionRecords=[],playTimer=null,draftSnapshot=null,lastDraftToken=null;
try{
 const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
 if(Array.isArray(saved))actionRecords=saved.filter(r=>r&&typeof r.id==='string'&&GROUPS.includes(r.group)&&typeof r.requirement==='string'&&Array.isArray(r.facts)&&r.facts.every(f=>typeof f==='string')&&typeof r.observedAt==='string'&&typeof r.createdAt==='string');
}catch{storageAvailable=false;}
function saveRecords(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(actionRecords));storageAvailable=true;}catch{storageAvailable=false;}}
function notify(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.hidden=true,4200);}
function pause(renderPage=true){clearTimeout(playTimer);playTimer=null;state.playing=false;if(renderPage)render();}
function advance(){
 if(state.mode==='today'){state.minute=Math.min(1440,state.minute+15);return state.minute<1440;}
 const next=STORY_DAYS.find(d=>d>state.monthDay);if(!next)return false;state.monthDay=next;state.storyIndex=STORY_DAYS.indexOf(next);return next<31;
}
function schedule(){
 clearTimeout(playTimer);if(!state.playing)return;
 playTimer=setTimeout(()=>{const hasNext=advance();if(!hasNext)state.playing=false;render();if(state.playing)schedule();else notify('历史回放已结束，可查看证据或重新播放。');},(state.mode==='today'?800:8000)/state.speed);
}
function startPlayback(restart=false){
 if(restart||state.mode==='today'&&state.minute===1440||state.mode==='month'&&state.monthDay===31){if(state.mode==='today')state.minute=0;else{state.monthDay=STORY_DAYS[0];state.storyIndex=0;}}
 state.playing=true;state.selectedGroup=null;state.selectedPerson=null;render();schedule();
}
function closeDialogs(){document.querySelectorAll('dialog[open]').forEach(d=>d.close());}
function openDetail(group,purpose='amount'){
 if(!GROUPS.includes(group))return;pause(false);state.selectedGroup=group;state.selectedPerson=null;state.selectedPurpose=purpose==='flow'?'flow':'amount';state.structure='cross';render();renderDetail();closeDialogs();document.getElementById('detailDialog').showModal();
}
function createDraft(group,purpose='amount'){
 if(!GROUPS.includes(group))return;pause(false);const s=currentSnapshot(),issue=issueFor(s,group,purpose);
 let facts=[...issue.facts],question=issue.question;
 if(state.selectedGroup===group&&!state.selectedPerson&&state.structure!=='cross'){
  const rows=structureRows(s,group,null,state.structure),driver=rows.find(r=>issue.g.delta<0?r.delta<0:r.delta>0)||rows[0];
  if(driver){facts[2]=`当前查看的${driver.key}：${wan(driver.baseline)}→${wan(driver.amount)}万元，变化${signedWan(driver.delta)}万元。`;question=`请${group}组长重点核对${driver.key}成交金额变化${signedWan(driver.delta)}万元的订单结构、人员覆盖与归属，确认当前承接后反馈核查事实。`;}
 }
 if(state.selectedGroup===group&&state.selectedPerson){
  const person=issue.people.find(p=>p.id===state.selectedPerson),driver=structureRows(s,group,state.selectedPerson,state.structure)[0];
  if(person){facts=[issue.facts[0],`重点核查销售${person.id}：正常金额${wan(person.baseline)}→${wan(person.amount)}万元，另有受限${person.restrictedCount}笔、${wan(person.restricted)}万元。`,driver?`${driver.key}当前${wan(driver.amount)}万元，变化${signedWan(driver.delta)}万元。`:'该人员当前无成交结构差额。',flowEvidence(s,group,person.id).summary];question=`请${group}组长核对销售${person.id}${driver?'的'+driver.key:''}金额变化和正常/受限成交归属，确认当前承接关系后再拆解处理，并反馈核查事实。`;}
 }
 draftSnapshot={token:Date.now()+'-'+Math.random().toString(36).slice(2),group,recipient:group+'小组长',mode:s.mode,observedAt:s.cut,comparison:s.baselineLabel,summary:issue.title,facts,requirement:question};lastDraftToken=null;
 state.selectedGroup=null;state.selectedPerson=null;
 render();document.getElementById('actionBody').innerHTML=`<div class="eyebrow">管理动作 · 本机模拟</div><h2>下发给${esc(group)}小组长</h2><div class="dispatch-meta"><div><span>关注小组</span><strong>${esc(group)}</strong></div><div><span>接收对象</span><strong>${esc(group)}小组长</strong></div><div><span>观察时点</span><strong>${s.cut}</strong></div><div><span>当前问题</span><strong>${issue.title}</strong></div></div><h3>关键证据</h3><ol class="draft-evidence">${facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ol><label class="editor-label" for="actionRequirement">管理要求 / 关注事项 <span>可直接修改</span></label><textarea id="actionRequirement" rows="4" maxlength="3000">${esc(question)}</textarea><p id="actionError" class="negative" role="alert"></p><p class="boundary-note">由组长核实当前承接后拆解。此操作只生成本机模拟记录，不发送真实消息。</p><div class="dialog-actions">${button('close-dialog','取消')}${button('confirm-dispatch','确认下发（模拟）','','primary')}</div>`;
 closeDialogs();document.getElementById('actionDialog').showModal();
}
function confirmDispatch(){
 if(!draftSnapshot||lastDraftToken===draftSnapshot.token)return;
 const requirement=document.getElementById('actionRequirement').value.trim();
 if(requirement.length<3){document.getElementById('actionError').textContent='请填写至少3个字的管理要求，再确认模拟下发。';return;}
 lastDraftToken=draftSnapshot.token;const record={...draftSnapshot,id:'ACT-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),requirement,createdAt:new Date().toISOString(),status:'已下发',feedback:'待反馈',simulation:true};delete record.token;
 actionRecords.unshift(record);saveRecords();render();
 document.getElementById('actionBody').innerHTML=`<div class="success-mark">✓</div><h2>模拟下发成功，已留痕</h2><p>${esc(record.recipient)} · 已下发 · 待反馈</p><p>记录已携带观察时点、关键证据和你的管理要求。</p><p class="boundary-note">${storageAvailable?'保存在本浏览器，重新打开可查看。':'浏览器本地保存不可用，记录仅保留在本次会话，请导出留存。'}没有发送任何真实消息。</p><div class="dialog-actions">${button('close-dialog','继续盯盘')}${button('records','查看动作记录','','primary')}</div>`;
}
function renderRecords(){
 document.getElementById('recordsBody').innerHTML=`<div class="detail-title"><div><div class="eyebrow">管理动作 · 本机模拟</div><h2>动作记录与证据留痕</h2><p>${storageAvailable?'保存在本浏览器，不同浏览器或文件地址可能独立存储。':'本地保存不可用；本次会话记录可导出留存。'}</p></div><div>${button('export-records','导出记录')}${actionRecords.length?button('clear-records','清空演示记录'):''}</div></div>${actionRecords.length?`<div class="record-list">${actionRecords.map(r=>`<article class="record"><div class="record-top"><div><strong>${esc(r.recipient)}</strong><span>${esc(r.group)}</span></div>${tag('模拟已下发','good')}${tag('待反馈')}</div><p class="record-requirement">${esc(r.requirement)}</p><div class="record-times"><span>操作时间（本机）：${esc(new Date(r.createdAt).toLocaleString('zh-CN',{hour12:false}))}</span><span>经营观察：${esc(r.observedAt)}</span></div><details><summary>查看下发时的证据快照</summary><p>${esc(r.summary)} · ${esc(r.comparison)}</p><ol>${r.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ol><small>记录编号：${esc(r.id)}</small></details></article>`).join('')}</div>`:'<div class="empty-state"><strong>尚无管理动作</strong><p>从优先关注中查看原因，再向对应小组长模拟下发，记录将保存在这里。</p></div>'}<p class="fine-print">“已下发 / 待反馈”是Demo状态。没有真实收件人回执，也不会生成虚构反馈。</p>`;
}
function exportRecords(){
 const file=new Blob(['\ufeff'+JSON.stringify({title:'南京分行经营驾驶舱 V0.2 模拟管理记录',exportedAt:new Date().toISOString(),records:actionRecords},null,2)],{type:'application/json;charset=utf-8'});
 const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download='V0.2_模拟管理动作记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);notify('已发起记录文件下载。');
}
document.addEventListener('click',event=>{
 const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
 if(action==='mode'){pause(false);state.mode=el.dataset.mode==='month'?'month':'today';state.selectedGroup=null;state.selectedPerson=null;closeDialogs();render();}
 else if(action==='play'){if(state.playing)pause();else startPlayback();}
 else if(action==='replay')startPlayback(true);
 else if(action==='next'){pause(false);advance();render();}
 else if(action==='stage'){pause(false);state.monthDay=Number(el.dataset.day);state.storyIndex=STORY_DAYS.indexOf(state.monthDay);state.selectedGroup=null;render();}
 else if(action==='reason')openDetail(el.dataset.group,el.dataset.purpose);
 else if(action==='branch-evidence'){pause(false);closeDialogs();state.selectedGroup=null;state.selectedPerson=null;state.structure='term';render();renderDetail();document.getElementById('detailDialog').showModal();}
 else if(action==='person'){state.selectedPerson=el.dataset.sale;renderDetail();document.getElementById('detailDialog').scrollTop=0;}
 else if(action==='group-detail'){state.selectedPerson=null;renderDetail();}
 else if(action==='structure'){state.structure=el.dataset.value;renderDetail();}
 else if(action==='dispatch')createDraft(el.dataset.group,el.dataset.purpose);
 else if(action==='confirm-dispatch')confirmDispatch();
 else if(action==='method'){pause();closeDialogs();renderMethod();document.getElementById('methodDialog').showModal();}
 else if(action==='records'){pause();closeDialogs();renderRecords();document.getElementById('recordsDialog').showModal();}
 else if(action==='export-records')exportRecords();
 else if(action==='clear-records'){document.getElementById('recordsBody').innerHTML=`<h2>清空本浏览器的模拟记录？</h2><p>将删除${actionRecords.length}条本机演示记录。可先导出保留证据。</p><div class="dialog-actions">${button('records','保留记录')}${button('export-records','先导出')}${button('confirm-clear','确认清空','','danger-button')}</div>`;}
 else if(action==='confirm-clear'){actionRecords=[];saveRecords();render();renderRecords();}
 else if(action==='close-dialog'){const dialog=el.closest('dialog');dialog?.close();draftSnapshot=null;if(dialog?.id==='detailDialog'){state.selectedGroup=null;state.selectedPerson=null;render();}}
});
document.addEventListener('change',event=>{
 const el=event.target;
 if(el.id==='observationDate'){
  if(!JULY.includes(el.value)){notify('请选择2026年7月的有效观察日期。');render();return;}
  pause(false);if(state.mode==='today')state.date=el.value;else state.monthDay=+el.value.slice(8);state.selectedGroup=null;state.selectedPerson=null;render();
 }else if(el.id==='timeRange'){pause(false);state.minute=Math.max(0,Math.min(1440,Math.round(Number(el.value)/15)*15));state.selectedGroup=null;state.selectedPerson=null;render();}
 else if(el.id==='playSpeed'){state.speed=[1,2,4].includes(+el.value)?+el.value:1;if(state.playing)schedule();}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.playing)pause();});
document.getElementById('detailDialog').addEventListener('cancel',()=>{state.selectedGroup=null;state.selectedPerson=null;render();});
render();

// Presentation only: show values at observed chart nodes; never infer intermediate trades.
const finalTooltip=document.createElement('div');
finalTooltip.id='finalChartTooltip';finalTooltip.className='final-tooltip';finalTooltip.hidden=true;finalTooltip.setAttribute('role','tooltip');
document.body.appendChild(finalTooltip);
function hideFinalTooltip(){finalTooltip.hidden=true;}
function showFinalTooltip(hit,clientX,clientY){
 const parts=JSON.parse(hit.dataset.chartTip);finalTooltip.innerHTML=`<b>${esc(parts[0])}</b>${parts.slice(1).map(t=>`<span>${esc(t)}</span>`).join('')}`;
 const owner=hit.closest('dialog')||document.body;if(finalTooltip.parentElement!==owner)owner.appendChild(finalTooltip);
 finalTooltip.hidden=false;finalTooltip.style.left='0px';finalTooltip.style.top='0px';
 const rect=finalTooltip.getBoundingClientRect(),margin=12,bounds=hit.closest('section').getBoundingClientRect();
 const leftEdge=Math.max(margin,bounds.left+margin),rightEdge=Math.min(window.innerWidth-margin,bounds.right-margin);
 const topEdge=Math.max(margin,bounds.top+margin),bottomEdge=Math.min(window.innerHeight-margin,bounds.bottom-margin);
 const top=clientY+16+rect.height>bottomEdge?clientY-rect.height-14:clientY+16;
 finalTooltip.style.left=Math.max(leftEdge,Math.min(clientX+16,rightEdge-rect.width))+'px';
 finalTooltip.style.top=Math.max(topEdge,Math.min(top,bottomEdge-rect.height))+'px';
}
document.addEventListener('pointermove',event=>{const hit=event.target.closest('[data-chart-tip]');if(hit)showFinalTooltip(hit,event.clientX,event.clientY);else hideFinalTooltip();});
document.addEventListener('focusin',event=>{const hit=event.target.closest('[data-chart-tip]');if(hit){const rect=hit.getBoundingClientRect();showFinalTooltip(hit,rect.left+rect.width/2,rect.top+rect.height/2);}else hideFinalTooltip();});
document.addEventListener('focusout',hideFinalTooltip);
document.addEventListener('pointerout',event=>{if(!event.relatedTarget)hideFinalTooltip();});
document.addEventListener('scroll',hideFinalTooltip,true);
document.addEventListener('click',hideFinalTooltip,true);
document.addEventListener('keydown',event=>{if(event.key==='Escape')hideFinalTooltip();});
document.addEventListener('visibilitychange',hideFinalTooltip);
// HTML rerenders on each replay frame; a previous tooltip must not linger across frames.
new MutationObserver(hideFinalTooltip).observe(document.getElementById('main'),{childList:true});
</script>
